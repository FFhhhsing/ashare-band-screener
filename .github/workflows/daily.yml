name: A股波段买点每日筛选

on:
  schedule:
    # 北京时间 15:10（UTC 07:10），周一至周五
    - cron: '10 7 * * 1-5'
  workflow_dispatch:   # 允许在 GitHub 页面手动点一次测试

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      PUSH_KEY: ${{ secrets.PUSH_KEY }}
      PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行选股
        run: python screener.py

      # 观察池必须回写仓库，否则每次 Actions 都是全新 checkout，
      # 观察池会被清零，回访区永远出不来
      - name: 保存观察池状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/watchlist.json
          if git diff --cached --quiet; then
            echo "观察池无变化，跳过提交"
          else
            git commit -m "chore: 更新观察池 $(date +%F)"
            git push
          fi

      - name: 发布报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          keep_files: true
