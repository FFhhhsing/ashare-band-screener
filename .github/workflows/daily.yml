name: A股波段买点每日筛选

on:
  push:
    branches: [main]   # 每次推送代码自动跑一次，方便改完立即验证
  schedule:
    # 北京时间 17:10（UTC 09:10），周一至周五
    # 为什么不等收盘(15:00)就跑：数据商当天日线要收盘后约 1 小时才发布。
    # 15:10 跑只能取到「上一交易日」日线 —— 周一跑会显示上周五的数据(看起来像3天没更新)；
    # 更麻烦的是历史日线(上一交易日)与实时快照(当日)日期不一致，评分会混用两个日期，导致重复筛选排名漂移。
    - cron: '10 9 * * 1-5'
  workflow_dispatch:   # 允许在 GitHub 页面手动点一次测试

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      # 定时触发按交易日判断（节假日正常提示休市）；
      # push/手动触发一律 FORCE_RUN，方便周末验证完整流程
      FORCE_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
      PUSH_KEY: ${{ secrets.PUSH_KEY }}
      PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行选股
        run: python screener.py

      # 观察池必须回写仓库，否则每次 Actions 都是全新 checkout，
      # 观察池会被清零，回访区永远出不来
      - name: 保存观察池与行业缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/watchlist.json
          if [ -f state/industry_map.json ]; then git add -f state/industry_map.json; fi
          if git diff --cached --quiet; then
            echo "观察池/行业缓存无变化，跳过提交"
          else
            git commit -m "chore: 更新观察池/行业缓存 $(date +%F) [skip ci]"
            git push
          fi

      - name: 发布报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          keep_files: true
